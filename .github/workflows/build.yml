name: Build Qurafiz APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qurafiz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Qurafiz.apk
          gh release create "build-${{ github.run_number }}" Qurafiz.apk \
            --title "Qurafiz build ${{ github.run_number }}" \
            --notes "Debug APK built automatically. Download Qurafiz.apk on your Android phone and install it."
