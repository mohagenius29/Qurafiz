name: Build Qurafiz APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests and build
        run: |
          set -o pipefail
          (gradle testDebugUnitTest assembleDebug --no-daemon --console=plain 2>&1 | tee build.log)

      - name: Save build log to branch
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . >/dev/null 2>&1 || true
          tail -n 400 build.log > log.txt
          git add -f log.txt
          git commit -m "build log run ${{ github.run_number }}"
          git push -f origin build-log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qurafiz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Qurafiz.apk
          gh release create "build-${{ github.run_number }}" Qurafiz.apk \
            --title "Qurafiz build ${{ github.run_number }}" \
            --notes "Debug APK built automatically. Download Qurafiz.apk on your Android phone and install it."
